name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Backend API Tests and Build
  backend-test:
    name: Backend API - Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      working-directory: LibraryManagement.Api
      run: dotnet restore

    - name: Build
      working-directory: LibraryManagement.Api
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      working-directory: LibraryManagement.Api.Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Generate coverage report
      uses: danielpalme/ReportGenerator-GitHubAction@5.2.0
      with:
        reports: '**/coverage.cobertura.xml'
        targetdir: 'coverage'
        reporttypes: 'HtmlInline;Badges'

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: '**/coverage.cobertura.xml'
        flags: backend
        name: backend-coverage

  # Frontend Build
  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: library-management/package-lock.json

    - name: Install dependencies
      working-directory: library-management
      run: npm ci

    - name: Build
      working-directory: library-management
      run: npm run build
      env:
        VITE_API_BASE_URL: http://localhost:5150/api

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: library-management/dist
        retention-days: 7

  # Docker Build
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./LibraryManagement.Api
        file: ./LibraryManagement.Api/Dockerfile
        push: false
        tags: library-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./library-management
        file: ./library-management/Dockerfile
        push: false
        tags: library-frontend:latest
        build-args: |
          VITE_API_BASE_URL=http://localhost:5150/api
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker Compose
      run: |
        docker-compose config

  # Integration Tests (Optional - can be expanded)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Start SQL Server
      run: |
        docker run -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=Test@Password123" \
          -p 1433:1433 --name test-sqlserver -d \
          mcr.microsoft.com/mssql/server:2022-latest
        sleep 30

    - name: Run integration tests
      working-directory: LibraryManagement.Api.Tests
      run: dotnet test --configuration Release
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=LibraryManagementTest;User Id=sa;Password=Test@Password123;TrustServerCertificate=true;"

    - name: Cleanup
      if: always()
      run: docker rm -f test-sqlserver || true

  # Security Scan (Optional)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

