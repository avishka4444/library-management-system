name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: YourStrong@Passw0rd
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Restore dependencies
        run: dotnet restore backend/tests/LibraryManagement.Api.Tests.csproj
      
      - name: Build API
        run: dotnet build --no-restore backend/LibraryManagement.Api.csproj
      
      - name: Build tests
        run: dotnet build --no-restore backend/tests/LibraryManagement.Api.Tests.csproj
      
      - name: Run tests
        run: dotnet test --no-build --verbosity normal backend/tests/LibraryManagement.Api.Tests.csproj
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=LibraryManagement_Test;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/tests/TestResults/**
          retention-days: 7
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: backend/tests/coverage/**
          retention-days: 7

